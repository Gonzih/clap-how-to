[package]
name = "clap-how-to"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Bundled offline semantic help search for Clap CLIs: how and how-to"
license = "MIT"
repository = "https://github.com/Gonzih/clap-how-to"
homepage = "https://github.com/Gonzih/clap-how-to"
readme = "README.md"
keywords = ["clap", "semantic-search", "embeddings", "cli", "offline"]
categories = ["command-line-interface", "text-processing"]
include = ["/src/**", "/assets/**", "/examples/*.rs", "/tests/**", "/benchmarks/**", "/scripts/*.py", "/docs/**", "/README.md", "/LICENSE", "/Cargo.toml", "/Cargo.lock"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
pocket-encoder = { version = "=0.1.0", path = "pocket-encoder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace]
members = ["pocket-encoder"]
resolver = "3"

[profile.dev]
debug = 0

[profile.test]
debug = 0
