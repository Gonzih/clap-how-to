[package]
name = "pocket-encoder"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A bundled, offline sentence transformer with native Rust CPU inference"
license = "MIT AND Apache-2.0"
repository = "https://github.com/Gonzih/clap-how-to"
readme = "README.md"
keywords = ["embeddings", "semantic-search", "offline", "candle", "encoder"]
categories = ["text-processing", "science"]
include = ["/src/**", "/assets/**", "/examples/**", "/tests/**", "/README.md", "/LICENSE", "/NOTICE", "/Cargo.toml"]

[features]
search = []

[dependencies]
safetensors = "0.7"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
half = "2.7"

[target.'cfg(not(all(target_arch = "aarch64", target_os = "linux")))'.dependencies]
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }

# MiniLM inference is F32. Do not compile GEMM's unused FP16 kernels on
# generic Linux ARM64, whose baseline does not include ARMv8.2 FP16.
[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
gemm = { version = "0.19", default-features = false, features = ["std", "rayon"] }
libm = "0.2"

[dev-dependencies]
sha2 = "0.11"
gemm = { version = "0.19", default-features = false, features = ["std", "rayon"] }
libm = "0.2"

[[example]]
name = "search"
required-features = ["search"]
